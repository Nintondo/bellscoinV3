name: Build and release Docker image
run-name: >-
  Build & release → ${{
    github.event_name == 'workflow_dispatch'
      && inputs.targets
      || 'none'
  }}

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA for build (default: latest in branch)'
        required: false
        default: ''
      targets:
        description: 'Auto-deploy target after build (mainnet is never auto-deployed)'
        required: true
        type: choice
        default: testnet
        options:
          - testnet
          - none
      build_jobs:
        description: 'Number of build jobs for Docker build (default: auto)'
        required: false
        default: '0'
      run_tests:
        description: 'Run tests during Docker build (0 or 1)'
        required: false
        default: '0'
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'depends/**'
      - 'contrib/**'
      - 'share/**'
      - 'Dockerfile'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semgrep-rust:
    runs-on: self-hosted
    steps:
      - name: Resolve SCAN_REF
        shell: bash
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          GITHUB_SHA_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SHA" ]; then
            echo "SCAN_REF=$INPUT_SHA" >> "$GITHUB_ENV"
          else
            echo "SCAN_REF=$GITHUB_SHA_REF" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository at selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SCAN_REF }}

      - name: Install Semgrep
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip pipx
          pipx ensurepath
          pipx install semgrep || pipx upgrade semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report all (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          semgrep --config p/rust .

      - name: Fail on WARNING
        shell: bash
        run: |
          set -euo pipefail
          semgrep --config p/rust --severity WARNING --error .

      - name: Fail on ERROR
        shell: bash
        run: |
          set -euo pipefail
          semgrep --config p/rust --severity ERROR --error .

  build:
    runs-on: self-hosted
    needs: semgrep-rust
    outputs:
      service_tag: ${{ steps.tag.outputs.service_tag }}
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      - name: Resolve SERVICE_TAG
        id: tag
        shell: bash
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          GITHUB_SHA_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SHA" ]; then
            echo "SERVICE_TAG=$INPUT_SHA" >> "$GITHUB_ENV"
            echo "service_tag=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "SERVICE_TAG=$GITHUB_SHA_REF" >> "$GITHUB_ENV"
            echo "service_tag=$GITHUB_SHA_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve IMAGE_NAME
        id: image
        shell: bash
        env:
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" = "main" ]; then
            IMAGE_NAME="$SERVICE_NAME"
          else
            IMAGE_NAME="${SERVICE_NAME}-${REF_NAME}"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Log SERVICE_TAG
        shell: bash
        run: |
          set -euo pipefail
          echo "Building image ${{ env.IMAGE_NAME }} with SHA ${{ env.SERVICE_TAG }}"

      - name: Checkout repository at selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SERVICE_TAG }}

      - name: Log in to Docker Registry
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
          CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
          CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$CI_REGISTRY_PASSWORD" \
            | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      - name: Build and release Docker image
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
          CI_REGISTRY_REPO: ${{ secrets.CI_REGISTRY_REPO }}
          BUILD_JOBS: ${{ github.event.inputs.build_jobs || '0' }}
          RUN_TESTS: ${{ github.event.inputs.run_tests || '0' }}
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          IMAGE="${CI_REGISTRY}/${CI_REGISTRY_REPO}/${IMAGE_NAME}"
          docker build \
            --no-cache \
            --pull \
            --build-arg "BUILD_JOBS=${BUILD_JOBS}" \
            --build-arg "RUN_TESTS=${RUN_TESTS}" \
            --label "org.opencontainers.image.revision=${SERVICE_TAG}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -f ./Dockerfile \
            -t "${IMAGE}:${SERVICE_TAG}" \
            -t "${IMAGE}:latest" \
            ./
          docker push "${IMAGE}:${SERVICE_TAG}"
          docker push "${IMAGE}:latest"

      - name: Docker logout
        if: always()
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
        run: |
          set +e
          docker logout "$CI_REGISTRY"
          exit 0

  fanout-deploy:
    runs-on: self-hosted
    needs: build
    if: >-
      github.ref_name == 'dev'
      && github.event_name == 'workflow_dispatch'
      && inputs.targets == 'testnet'
    steps:
      - name: Checkout repository for local actions
        uses: actions/checkout@v5

      - name: Trigger testnet deploy
        uses: ./.github/actions/repository-dispatch
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN || github.token }}
          repository: ${{ github.repository }}
          event_type: deploy
          client_payload: |
            {
              "network": "testnet",
              "sha": "${{ needs.build.outputs.service_tag }}",
              "ref": "${{ github.ref }}",
              "image_name": "${{ needs.build.outputs.image_name }}"
            }
